<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MAF 2026 · CHAYAKADA – LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;700;800&family=Rozha+One&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* the ambient glow colour eases smoothly between teams (Chrome, Edge, most TV browsers) */
  @property --glow { syntax: '<color>'; inherits: true; initial-value: #176B3A; }
  :root{
    --glow:#176B3A; --cream:#F3E9D5; --ink:#332319; --brn:#79543A;
    --meluha:#176B3A; --maabar:#1764B7; --muziris:#C69A32;
    --glass:rgba(28,21,17,.62); --line:rgba(243,233,213,.14);
    transition: --glow 1.6s ease;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0d0a08;color:var(--cream);font-family:'Anek Malayalam',sans-serif}
  body{position:relative;display:grid;grid-template-rows:auto 1fr auto;height:100vh;padding:1.4vw 1.8vw 0;gap:1.2vw}

  /* ---------- ambience ---------- */
  .ambient{position:fixed;inset:-10%;z-index:-3;
    background:
      radial-gradient(55vw 60vh at 12% 18%, color-mix(in srgb,var(--glow) 55%,transparent), transparent 70%),
      radial-gradient(50vw 55vh at 88% 85%, color-mix(in srgb,var(--glow) 40%,transparent), transparent 72%),
      #0d0a08;
    animation: drift 26s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.05)}}
  .grain{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.07;
    background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 4px)}
  .vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.7))}

  /* ---------- header ---------- */
  header{display:flex;justify-content:space-between;align-items:center;gap:2vw}
  .brand{display:flex;align-items:center;gap:1.2vw}
  .brand .cup{font-size:3.4vw;filter:drop-shadow(0 0 1vw var(--glow))}
  h1{font-family:'Rozha One',serif;font-size:3.8vw;line-height:1;letter-spacing:.05vw;
     background:linear-gradient(180deg,#fff7e6,#e7c98f);-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 .3vw 0 var(--brn))}
  .fest{font-family:'Special Elite',monospace;font-size:1.25vw;letter-spacing:.22vw;margin-top:.6vw;opacity:.85;color:#e7c98f}
  .fest b{color:#fff7e6;font-weight:400;background:var(--glow);padding:.1vw .6vw;border-radius:.4vw;margin-right:.4vw}
  .hright{display:flex;align-items:center;gap:2vw}
  #clock{font-family:'Special Elite',monospace;font-size:2vw;opacity:.8;letter-spacing:.1vw}
  #live{font-family:'Special Elite',monospace;font-size:1.5vw;letter-spacing:.2vw;display:flex;align-items:center;gap:.7vw;
        padding:.5vw 1.2vw;border-radius:99vw;background:rgba(0,0,0,.4);border:.15vw solid var(--line);color:#aaa;transition:.4s}
  #live i{width:1vw;height:1vw;border-radius:50%;background:#666}
  #live.on{color:#fff;border-color:rgba(229,57,53,.6)}
  #live.on i{background:#ff3b30;box-shadow:0 0 1vw #ff3b30;animation:pulse 1.3s infinite}
  @keyframes pulse{50%{opacity:.3;transform:scale(.8)}}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:1fr 1.75fr 1fr;gap:1.6vw;min-height:0}
  .card{position:relative;min-height:0;display:flex;flex-direction:column;gap:1vw;padding:1.4vw;border-radius:1.4vw;
        background:var(--glass);border:.1vw solid var(--line);box-shadow:0 1vw 3vw rgba(0,0,0,.35);
        -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .label{font-family:'Special Elite',monospace;font-size:1.3vw;letter-spacing:.25vw;text-transform:uppercase;opacity:.65;display:flex;align-items:center;gap:.8vw}
  .label::after{content:"";flex:1;height:.1vw;background:var(--line)}

  /* ---------- scoreboard ---------- */
  .team{position:relative;padding:1.1vw 1.2vw 1.2vw 1.6vw;border-radius:1vw;background:rgba(0,0,0,.25);overflow:hidden;
        transition:transform .6s cubic-bezier(.2,1.2,.4,1)}
  .team::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.5vw;background:var(--tc);box-shadow:0 0 1.2vw var(--tc)}
  .team.lead{transform:scale(1.02);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 28%,transparent),rgba(0,0,0,.2))}
  .trow{display:flex;justify-content:space-between;align-items:flex-end;gap:1vw}
  .tname{font-family:'Rozha One',serif;font-size:2.4vw;line-height:1;color:var(--tc);text-shadow:0 0 1.5vw color-mix(in srgb,var(--tc) 50%,transparent)}
  .tmeta{font-family:'Special Elite',monospace;font-size:1.1vw;opacity:.7;margin-top:.4vw}
  .tpts{font-family:'Rozha One',serif;font-size:4.2vw;line-height:.9;color:#fff;font-variant-numeric:tabular-nums}
  .track{height:1.1vw;margin-top:.9vw;border-radius:99vw;background:rgba(255,255,255,.08);overflow:hidden}
  .fill{height:100%;border-radius:99vw;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 70%,#000),var(--tc));box-shadow:0 0 1.2vw var(--tc);
        transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .rankbadge{position:absolute;right:1vw;top:.8vw;font-family:'Special Elite',monospace;font-size:1.2vw;opacity:.6}

  /* ---------- meme stage ---------- */
  .stage{flex:1;min-height:0;display:grid;place-items:center;perspective:90vw}
  .polaroid{position:relative;display:flex;flex-direction:column;align-items:center;gap:1vw;padding:1.2vw 1.2vw 2.6vw;max-height:100%;
            background:linear-gradient(180deg,#fffdf6,#f1e7cf);color:var(--ink);border-radius:.5vw;
            box-shadow:0 2vw 4vw rgba(0,0,0,.55),0 0 0 .2vw color-mix(in srgb,var(--tc) 60%,transparent);
            transform:rotate(-1.2deg);animation:pop .8s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(3vw) rotate(-6deg) scale(.9)}to{opacity:1;transform:rotate(-1.2deg) scale(1)}}
  .pic{height:min(60vh,56vw);width:min(60vh,56vw);max-width:100%;display:grid;place-items:center;overflow:hidden;
       background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--tc) 35%,#fff),color-mix(in srgb,var(--tc) 15%,#fff))}
  .pic img{width:100%;height:100%;object-fit:contain;animation:fade 1s ease both}
  @keyframes fade{from{opacity:0}}
  .emo{font-size:min(30vh,22vw);filter:drop-shadow(0 1vw 1vw rgba(0,0,0,.25))}
  .cap{font-weight:800;font-size:2.4vw;line-height:1.3;text-align:center;max-width:58vw}
  .ribbon{position:absolute;top:2.2vw;left:-1.4vw;padding:.4vw 1.4vw;background:var(--tc);color:#fff;
          font-family:'Special Elite',monospace;font-size:1.35vw;letter-spacing:.1vw;box-shadow:0 .4vw 1vw rgba(0,0,0,.4);
          clip-path:polygon(0 0,100% 0,calc(100% - .8vw) 50%,100% 100%,0 100%)}
  .reacts{display:flex;gap:1.6vw;font-family:'Special Elite',monospace;font-size:1.6vw;color:var(--ink)}
  .reacts b{color:var(--tc)}
  .trend{position:absolute;top:-1.4vw;right:-1.4vw;background:#ff3b30;color:#fff;padding:.4vw 1.2vw;border-radius:99vw;
         font-family:'Special Elite',monospace;font-size:1.2vw;box-shadow:0 .5vw 1.2vw rgba(255,59,48,.5);animation:pulse 1.6s infinite}

  /* ---------- chat ---------- */
  #msgs{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:.9vw;overflow:hidden}
  .msg{display:flex;gap:.9vw;align-items:flex-start;animation:slide .6s cubic-bezier(.2,1,.3,1) both}
  @keyframes slide{from{opacity:0;transform:translateX(2vw)}}
  .av{flex:none;width:3.2vw;height:3.2vw;border-radius:50%;display:grid;place-items:center;background:var(--tc);color:#fff;
      font-family:'Rozha One',serif;font-size:1.7vw;box-shadow:0 0 1vw color-mix(in srgb,var(--tc) 60%,transparent)}
  .bub{flex:1;min-width:0;padding:.7vw 1vw;border-radius:0 1.2vw 1.2vw 1.2vw;background:rgba(255,255,255,.07);border:.1vw solid var(--line)}
  .bub b{font-size:1.4vw;color:var(--tc);filter:brightness(1.35)}
  .bub small{font-size:1vw;opacity:.55;margin-left:.6vw}
  .bub p{font-size:1.75vw;line-height:1.35;margin-top:.2vw;overflow-wrap:anywhere}
  .empty{font-size:1.8vw;opacity:.6;text-align:center;margin:auto}

  /* ---------- leader banner + confetti ---------- */
  #banner{position:fixed;left:50%;top:9vw;transform:translate(-50%,-30vw);z-index:5;padding:1vw 2.6vw;border-radius:99vw;
          background:linear-gradient(90deg,#c69a32,#fff1c4,#c69a32);color:#2a1d10;font-family:'Rozha One',serif;font-size:2.2vw;
          box-shadow:0 1vw 3vw rgba(0,0,0,.5);transition:transform .8s cubic-bezier(.2,1.2,.4,1);white-space:nowrap}
  #banner.show{transform:translate(-50%,0)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .bit{position:absolute;top:-4vh;width:.9vw;height:1.6vw;border-radius:.2vw;background:var(--c);
       animation:fall var(--d) cubic-bezier(.3,.1,.6,1) forwards;transform:translateX(var(--x)) rotate(0)}
  @keyframes fall{to{transform:translate(calc(var(--x) + var(--drift))) rotate(var(--r));top:110vh;opacity:.9}}

  /* ---------- ticker ---------- */
  .ticker{position:relative;overflow:hidden;height:4.6vw;margin:0 -1.8vw;display:flex;align-items:center;
          background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.25),rgba(0,0,0,.6));border-top:.1vw solid var(--line)}
  .tk{display:flex;gap:4vw;white-space:nowrap;padding-left:100%;animation:tick var(--t,40s) linear infinite;font-size:2vw;font-weight:700}
  .tk span{display:inline-flex;align-items:center;gap:1.2vw}
  .tk span::after{content:"✦";color:var(--glow);opacity:.9}
  @keyframes tick{to{transform:translateX(-100%)}}
</style>
</head>
<body>
<div class="ambient"></div><div class="grain"></div><div class="vignette"></div>
<div id="confetti"></div>
<div id="banner"></div>

<header>
  <div class="brand"><span class="cup">☕</span>
    <div><h1>ചായക്കട കവല</h1>
    <div class="fest"><b>MAF 2026</b> · MAJMA'A ART FEST 2026</div></div></div>
  <div class="hright"><div id="clock">--:--</div><div id="live"><i></i>LIVE</div></div>
</header>

<main>
  <section class="card">
    <div class="label">സ്കോർബോർഡ്</div>
    <div id="board" style="display:flex;flex-direction:column;gap:1.2vw;flex:1;justify-content:center"></div>
  </section>
  <section class="card" style="padding:1.2vw">
    <div class="stage" id="stage"></div>
  </section>
  <section class="card">
    <div class="label">ചാറ്റ്</div>
    <div id="msgs"></div>
  </section>
</main>

<div class="ticker"><div class="tk" id="tk"></div></div>

<script>
const API = '/api?i=1&a=get';
const TC = {meluha:'#176B3A', maabar:'#1764B7', muziris:'#C69A32'};   // team colours, as hex for the glow
const PHOTO = /^(uploads\/|\/api\/img\?)/;
let D = null, memeList = [], memeNo = 0, seenMeme = null, seenMsg = 0, prevLead = '', sigBoard = '', sigTk = '', sigMsgs = '';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name = k => (D && D.TEAMS[k] && D.TEAMS[k].name) || '';
const col = k => TC[k] || '#c69a32';
const initial = k => esc((name(k) || '?')[0]);

async function load(){
  try {
    const r = await fetch(API + '&_=' + Date.now(), {cache:'no-store'});
    const j = await r.json(); if (j.error) throw new Error(j.error);
    D = j; $('#live').classList.add('on');
    memeList = [...D.memes].sort((a, b) => b.id - a.id);
    const top = memeList.length ? memeList[0].id : null;
    if (seenMeme !== null && top !== null && top !== seenMeme) { memeNo = 0; burst(col(memeList[0].t)); }
    if (top !== null) seenMeme = top;
    renderBoard(); renderChat(); renderTicker(); showMeme();
  } catch (e) {
    $('#live').classList.remove('on');   // keep the last good screen, just show we're not live
  }
}

function renderBoard(){
  const sc = D.START_SCORES, keys = Object.keys(D.TEAMS);
  const order = [...keys].sort((a, b) => (sc[b] || 0) - (sc[a] || 0));
  const max = Math.max(1, ...keys.map(k => sc[k] || 0));
  const lead = order[0];
  if (prevLead && lead !== prevLead) banner(`🏆 ${name(lead)} ഒന്നാം സ്ഥാനത്ത്!`, col(lead));
  prevLead = lead;
  const sig = JSON.stringify([order, sc, D.cheers, D.TEAMS]);
  if (sig === sigBoard) return; sigBoard = sig;
  $('#board').innerHTML = order.map((k, i) => `
    <div class="team ${i === 0 ? 'lead' : ''}" style="--tc:${col(k)}">
      <div class="rankbadge">#${i + 1}</div>
      <div class="trow">
        <div><div class="tname">${esc(name(k))}</div>
             <div class="tmeta">🏆 ${esc(D.TEAMS[k].victories)} വിജയങ്ങൾ · 🔥 ${esc((D.cheers || {})[k] || 0)}</div></div>
        <div class="tpts">${esc(sc[k] || 0)}</div>
      </div>
      <div class="track"><div class="fill" style="width:${(sc[k] || 0) / max * 100}%"></div></div>
    </div>`).join('');
}

function renderChat(){
  const last = D.chat.slice(-12), newest = last.length ? last[last.length - 1].id : 0;
  const sig = last.map(m => m.id + ':' + Object.values(m.r || {}).reduce((a, b) => a + (+b || 0), 0)).join(',');
  if (sig === sigMsgs) return; sigMsgs = sig;
  const box = $('#msgs');
  box.innerHTML = last.length ? last.map(m => {
    const reacts = Object.values(m.r || {}).reduce((a, b) => a + (+b || 0), 0);
    const still = m.id > seenMsg ? '' : ';animation:none';          // only brand-new messages slide in
    return `<div class="msg" style="--tc:${col(m.t)}${still}">
      <div class="av">${initial(m.t)}</div>
      <div class="bub"><b>${esc(m.u)}</b><small>${esc(name(m.t))}${reacts ? ' · 👍 ' + reacts : ''}</small><p>${esc(m.m)}</p></div></div>`;
  }).join('') : '<p class="empty">ആരും ഇതുവരെ പറഞ്ഞിട്ടില്ല. നീ തുടങ്ങ്! ☕</p>';
  seenMsg = Math.max(seenMsg, newest);
}

function showMeme(){
  const st = $('#stage');
  if (!memeList.length) { st.innerHTML = '<p class="empty">ട്രോളുകൾ വരാൻ പോകുന്നു 😂</p>'; return; }
  const m = memeList[memeNo % memeList.length];
  document.documentElement.style.setProperty('--glow', col(m.t));   // the whole room takes the team's colour
  const pic = PHOTO.test(m.img) ? `<img src="${esc(m.img)}" alt="">` : `<span class="emo">${esc(m.img)}</span>`;
  const trending = memeList.some(x => x.likes > 0) && m.likes === Math.max(...memeList.map(x => x.likes)) && m.likes > 0;
  st.innerHTML = `
    <div class="polaroid" style="--tc:${col(m.t)}">
      <span class="ribbon">${esc(name(m.t))}</span>
      ${trending ? '<span class="trend">🔥 TRENDING</span>' : ''}
      <div class="pic">${pic}</div>
      <div class="cap">${esc(m.cap)}</div>
      <div class="reacts"><span>😂 <b>${esc(m.laughs || 0)}</b></span><span>🔥 <b>${esc(m.likes || 0)}</b></span></div>
    </div>`;
}

function renderTicker(){
  const items = ['MAF 2026 · MAJMA\'A ART FEST 2026', ...(D.NOTICES || []).map(n => `${n.title}${n.text ? ' – ' + n.text : ''}`), 'ചായ തണുക്കും മുമ്പ് വോട്ട് ചെയ്യൂ ☕', 'ട്രോൾ അയക്കൂ, ചുവരിൽ ഒട്ടിക്കാം 📌'];
  const sig = items.join('|');
  if (sig === sigTk) return; sigTk = sig;
  const row = items.map(t => `<span style="color:var(--cream)">${esc(t)}</span>`).join('');
  $('#tk').innerHTML = row + row;
  $('#tk').style.setProperty('--t', Math.max(30, items.join(' ').length * 0.35) + 's');
}

let bannerTimer;
function banner(text, c){
  const b = $('#banner'); b.textContent = text; b.style.borderColor = c;
  b.classList.add('show'); clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove('show'), 6000);
  burst(c);
}
function burst(c){
  const box = $('#confetti'), colors = [c, '#fff1c4', '#ffb020', '#ffffff', '#ff5a5f'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('i'); el.className = 'bit';
    el.style.cssText = `left:${Math.random()*100}%;--c:${colors[i % colors.length]};--x:0vw;--drift:${(Math.random()*30-15)}vw;--r:${Math.random()*720-360}deg;--d:${2.2+Math.random()*1.8}s;animation-delay:${Math.random()*.4}s`;
    box.appendChild(el); setTimeout(() => el.remove(), 4800);
  }
}

function tickClock(){
  const d = new Date(); $('#clock').textContent = d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12: true});
}

load(); tickClock();
setInterval(load, 30000);                  // fresh data every 30 s
setInterval(() => { memeNo++; showMeme(); }, 9000);   // next meme every 9 s
setInterval(tickClock, 15000);
setTimeout(() => location.reload(), 6 * 3600 * 1000);
if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
</script>
</body>
</html>
