<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MAF 2026 · CHAYAKADA – LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @property --glow { syntax: '<color>'; inherits: true; initial-value: #176B3A; }
  /* LITE mode (set by script): no blur, shadows, confetti, or looping effects, so weak TV boxes stay smooth */
  html.lite, html.lite *{animation:none!important;transition:none!important;box-shadow:none!important;text-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  html.lite .tk{animation:tick var(--t,40s) linear infinite!important}
  html.lite .ambient,html.lite .vignette,html.lite #confetti,html.lite .grain{display:none}
  html.lite .meme{box-shadow:0 0 0 .2vw #ccc!important}
  :root{
    --glow:#176B3A;
    --bg:#0c0f14; --panel:#131821; --panel2:#18202b; --line:rgba(255,255,255,.07);
    --text:#e9edf2; --muted:#8b96a5; --gold:#d9b26a;
    --meluha:#1f8a4c; --maabar:#2d7ad6; --muziris:#d9a53b;
    transition: --glow 1.6s ease;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter','Anek Malayalam',system-ui,sans-serif}
  body{position:relative;display:grid;grid-template-rows:auto 1fr auto;height:100vh;padding:1.6vw 2vw 0;gap:1.4vw}
  svg.i{width:1.5vw;height:1.5vw;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ml{font-family:'Anek Malayalam','Inter',sans-serif}

  /* ambience: a soft team-coloured light, very subtle, plus a quiet vignette */
  .ambient{position:fixed;inset:-10%;z-index:-2;pointer-events:none;
    background:radial-gradient(60vw 55vh at 10% 0%, color-mix(in srgb,var(--glow) 28%,transparent), transparent 70%),
               radial-gradient(45vw 50vh at 100% 100%, color-mix(in srgb,var(--glow) 18%,transparent), transparent 70%);
    animation: drift 30s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate3d(2%,-1%,0)}}
  .vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(130% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.55))}

  /* header */
  header{display:flex;justify-content:space-between;align-items:center;gap:2vw;padding-bottom:1vw;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:1.2vw}
  .mark{width:3.4vw;height:3.4vw;border-radius:.9vw;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);color:var(--gold)}
  .mark svg.i{width:1.9vw;height:1.9vw}
  h1{font-family:'Anek Malayalam',sans-serif;font-weight:800;font-size:2.4vw;line-height:1.1;letter-spacing:.02vw}
  .fest{font-size:1.1vw;color:var(--muted);letter-spacing:.14vw;text-transform:uppercase;margin-top:.3vw}
  .fest b{color:var(--gold);font-weight:700;margin-right:.6vw}
  .hright{display:flex;align-items:center;gap:1.6vw}
  #clock{font-size:1.9vw;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  #live{display:flex;align-items:center;gap:.6vw;padding:.5vw 1.1vw;border-radius:99vw;background:var(--panel);border:1px solid var(--line);
        font-size:1.2vw;font-weight:700;letter-spacing:.14vw;color:var(--muted);transition:.4s}
  #live i{width:.8vw;height:.8vw;border-radius:50%;background:#555}
  #live.on{color:var(--text)}
  #live.on i{background:#ef4444;box-shadow:0 0 .9vw #ef4444;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* layout */
  main{display:grid;grid-template-columns:1fr 1.7fr 1.05fr;gap:1.4vw;min-height:0}
  .panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:1.1vw;overflow:hidden}
  .phead{display:flex;align-items:center;gap:.7vw;padding:1.1vw 1.4vw;border-bottom:1px solid var(--line);
         font-size:1.2vw;font-weight:700;letter-spacing:.1vw;text-transform:uppercase;color:var(--muted)}
  .phead svg.i{color:var(--gold);width:1.4vw;height:1.4vw}
  .phead .count{margin-left:auto;font-size:1.05vw;color:var(--muted);font-weight:600}
  .pbody{flex:1;min-height:0;padding:1.2vw;display:flex;flex-direction:column}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vw;height:100%;color:var(--muted);font-size:1.5vw;text-align:center}
  .empty svg.i{width:3vw;height:3vw;color:var(--gold);opacity:.8}

  /* scoreboard */
  #board{display:flex;flex-direction:column;gap:1vw;flex:1;justify-content:center;min-height:0}
  .team{position:relative;padding:1.2vw 1.3vw;border-radius:.9vw;background:var(--panel2);border:1px solid var(--line);transition:.6s}
  .team::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:.28vw;border-radius:.2vw;background:var(--tc)}
  .team.lead{border-color:color-mix(in srgb,var(--tc) 55%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 14%,var(--panel2)),var(--panel2))}
  .trow{display:flex;justify-content:space-between;align-items:center;gap:1vw}
  .rank{width:2.4vw;height:2.4vw;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:1.2vw;font-weight:700;color:var(--muted);flex:none}
  .team.lead .rank{background:var(--tc);color:#fff}
  .tname{font-size:1.9vw;font-weight:800;color:var(--text)}
  .tmeta{display:flex;gap:1vw;align-items:center;font-size:1.05vw;color:var(--muted);margin-top:.35vw}
  .tmeta span{display:inline-flex;align-items:center;gap:.35vw}
  .tmeta svg.i{width:1.1vw;height:1.1vw}
  .tpts{font-size:3.4vw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
  .track{height:.7vw;margin-top:1vw;border-radius:99vw;background:rgba(255,255,255,.06);overflow:hidden}
  .fill{height:100%;border-radius:99vw;background:var(--tc);transition:width 1.3s cubic-bezier(.2,.8,.2,1)}

  /* meme stage */
  .stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
  .meme{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:stretch;gap:.9vw;padding:1vw 1vw 1vw;
        background:#f4f1ea;color:#1b1f26;border-radius:.8vw;box-shadow:0 1.2vw 3vw rgba(0,0,0,.45);animation:in .7s cubic-bezier(.2,1,.3,1) both}
  @keyframes in{from{opacity:0;transform:translateY(1.5vw) scale(.97)}}
  .meme .pic{flex:1;min-height:0;width:100%;display:grid;place-items:center;overflow:hidden;border-radius:.4vw;
             background:#e9e4da;background:color-mix(in srgb,var(--tc) 18%,#fff)}
  .meme .pic.nopic{background:#e9e4da;font-size:1.3vw;color:#6b7280;text-align:center;padding:2vw}
  .meme .pic.nopic::after{content:'ഫോട്ടോ ലോഡ് ചെയ്യാൻ പറ്റുന്നില്ല'}
  .meme .pic img{display:block;width:100%;height:100%;object-fit:contain}
  @keyframes fade{from{opacity:0}}
  .meme .emo{font-size:14vh;line-height:1}
  .meme .foot{display:flex;justify-content:space-between;align-items:center;gap:1.5vw;padding:0 .4vw;flex:none}
  .cap{font-size:2.1vw;font-weight:800;line-height:1.3;color:#1b1f26;max-width:52vw}
  .tag{display:inline-flex;align-items:center;gap:.5vw;padding:.4vw .9vw;border-radius:99vw;background:var(--tc);color:#fff;font-size:1.1vw;font-weight:700;white-space:nowrap}
  .tag svg.i{width:1.1vw;height:1.1vw}
  .stats{display:flex;gap:1.2vw;font-size:1.3vw;font-weight:700;color:#4b5563;white-space:nowrap}
  .stats span{display:inline-flex;align-items:center;gap:.4vw}
  .stats svg.i{width:1.3vw;height:1.3vw;color:var(--tc)}
  .hot{position:absolute;top:1.2vw;right:1.2vw;display:inline-flex;align-items:center;gap:.4vw;padding:.4vw .9vw;border-radius:99vw;
       background:#111827;color:#fff;font-size:1.05vw;font-weight:700}
  .hot svg.i{width:1.1vw;height:1.1vw;color:#f97316}

  /* chat: compact rows, many visible at once */
  #msgs{display:flex;flex-direction:column;justify-content:flex-end;gap:.2vw;height:100%;overflow:hidden}
  .row2{display:grid;grid-template-columns:2.6vw 1fr;gap:.9vw;padding:.7vw .6vw;border-radius:.6vw;border-left:.22vw solid var(--tc);
        background:rgba(255,255,255,.025);animation:slide .5s ease both}
  .row2.old{animation:none}
  @keyframes slide{from{opacity:0;transform:translateY(.8vw)}}
  .av{width:2.6vw;height:2.6vw;border-radius:50%;display:grid;place-items:center;background:var(--tc);color:#fff;font-size:1.2vw;font-weight:700}
  .meta2{display:flex;align-items:baseline;gap:1vw;flex-wrap:wrap}
  .meta2 b{font-size:1.2vw;font-weight:700;color:var(--tc);filter:brightness(1.35)}
  .meta2 small{font-size:1vw;color:var(--muted)}
  .meta2 .rx{margin-left:auto;display:inline-flex;align-items:center;gap:.25vw;font-size:1vw;color:var(--muted)}
  .meta2 .rx svg.i{width:1vw;height:1vw}
  .msgtext{font-size:1.3vw;line-height:1.38;color:var(--text);overflow-wrap:anywhere;margin-top:.15vw}

  /* leader banner + confetti */
  #banner{position:fixed;left:50%;top:7vw;transform:translate(-50%,-22vw);z-index:5;display:flex;align-items:center;gap:.9vw;
          padding:.9vw 1.8vw;border-radius:99vw;background:#101720;border:1px solid var(--gold);color:var(--text);
          font-size:1.7vw;font-weight:700;box-shadow:0 1vw 3vw rgba(0,0,0,.5);transition:transform .7s cubic-bezier(.2,1.1,.4,1);white-space:nowrap}
  #banner svg.i{width:2vw;height:2vw;color:var(--gold)}
  #banner.show{transform:translate(-50%,0)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .bit{position:absolute;top:-4vh;width:.7vw;height:1.2vw;border-radius:.15vw;background:var(--c);
       animation:fall var(--d) cubic-bezier(.3,.1,.6,1) forwards}
  @keyframes fall{to{transform:translate(var(--drift),110vh) rotate(var(--r));opacity:.85}}

  /* ticker */
  .ticker{display:flex;align-items:center;height:4.2vw;margin:0 -2vw;background:#0a0d12;border-top:1px solid var(--line);overflow:hidden}
  .tlabel{flex:none;height:100%;display:flex;align-items:center;gap:.6vw;padding:0 1.6vw;background:var(--panel2);color:var(--gold);font-size:1.15vw;font-weight:700;letter-spacing:.1vw;z-index:1}
  .tlabel svg.i{width:1.3vw;height:1.3vw}
  .tkwrap{flex:1;overflow:hidden}
  .tk{display:flex;gap:3.5vw;white-space:nowrap;padding-left:100%;animation:tick var(--t,40s) linear infinite;font-size:1.5vw;color:var(--text)}
  .tk span{display:inline-flex;align-items:center;gap:1vw}
  .tk span::before{content:"";width:.45vw;height:.45vw;border-radius:50%;background:var(--gold)}
  @keyframes tick{to{transform:translateX(-100%)}}
</style>
</head>
<body>
<div id="dbg" style="position:fixed;left:.6vw;bottom:5vw;z-index:9;font:14px monospace;background:rgba(0,0,0,.75);color:#0f0;padding:.4em .7em;display:none"></div>
<div class="ambient"></div><div class="vignette"></div>
<div id="confetti"></div>
<div id="banner"></div>

<!-- icon set (inline SVG, no external files) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cup" viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-3-2-5-3-7-1 2-2 3-3 3 0-3-1-6-4-8 0 3-2 5-2 8a4 4 0 0 0-1 2 7 7 0 0 0 6 9z"/></symbol>
  <symbol id="i-laugh" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></symbol>
  <symbol id="i-thumb" viewBox="0 0 24 24"><path d="M7 10v11H3V10h4zM7 10l4-7a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2l-2 8a2 2 0 0 1-2 2H7"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 10.8V6a3 3 0 0 1 6 0v4.8l2 2.2H7l2-2.2z"/></symbol>
  <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM16 8a5 5 0 0 1 0 8"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5L3 8z"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></symbol>
  <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4"/></symbol>
</svg>

<header>
  <div class="brand">
    <div class="mark"><svg class="i"><use href="#i-cup"/></svg></div>
    <div>
      <h1 class="ml">ചായക്കട കവല</h1>
      <div class="fest"><b>MAF 2026</b>Majma'a Art Fest 2026</div>
    </div>
  </div>
  <div class="hright">
    <div id="clock">--:--</div>
    <div id="live"><i></i>LIVE</div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="phead"><svg class="i"><use href="#i-board"/></svg>സ്കോർബോർഡ്</div>
    <div class="pbody"><div id="board"></div></div>
  </section>

  <section class="panel">
    <div class="phead"><svg class="i"><use href="#i-film"/></svg>ട്രോളുകൾ<span class="count" id="memeCount"></span></div>
    <div class="pbody"><div class="stage" id="stage"></div></div>
  </section>

  <section class="panel">
    <div class="phead"><svg class="i"><use href="#i-chat"/></svg>ചാറ്റ്<span class="count" id="msgCount"></span></div>
    <div class="pbody"><div id="msgs"></div></div>
  </section>
</main>

<div class="ticker">
  <div class="tlabel"><svg class="i"><use href="#i-megaphone"/></svg>അറിയിപ്പുകൾ</div>
  <div class="tkwrap"><div class="tk" id="tk"></div></div>
</div>

<script>
const API = '/api?i=1&a=get';
const TC = {meluha:'#1f8a4c', maabar:'#2d7ad6', muziris:'#d9a53b'};
const PHOTO = /^(uploads\/|\/api\/img\?)/;
const ic = (id, cls = '') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const QS = new URLSearchParams(location.search), UA = navigator.userAgent || '';
const LITE = QS.has('lite') || (!QS.has('full') && ((navigator.deviceMemory && navigator.deviceMemory <= 1) || (/Android/.test(UA) && !/Mobile/.test(UA))));
const DEBUG = QS.has('debug');
document.documentElement.classList.toggle('lite', LITE);
let D = null, memeList = [], memeNo = 0, seenMeme = null, seenMsg = 0, prevLead = '', sigBoard = '', sigTk = '', sigMsgs = '', sigMeme = '';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name = k => (D && D.TEAMS[k] && D.TEAMS[k].name) || '';
const col = k => TC[k] || '#d9b26a';
const initial = k => esc((name(k) || '?')[0]);
const total = r => Object.values(r || {}).reduce((a, b) => a + (+b || 0), 0);

async function load(){
  try {
    const r = await fetch(API + '&_=' + Date.now(), {cache:'no-store'});
    const j = await r.json(); if (j.error) throw new Error(j.error);
    D = j; $('#live').classList.add('on');
    memeList = [...D.memes].sort((a, b) => b.id - a.id);
    const top = memeList.length ? memeList[0].id : null;
    if (seenMeme !== null && top !== null && top !== seenMeme) { memeNo = 0; burst(col(memeList[0].t)); }
    if (top !== null) seenMeme = top;
    renderBoard(); renderChat(); renderTicker(); showMeme();
  } catch (e) { $('#live').classList.remove('on'); }
}

function renderBoard(){
  const sc = D.START_SCORES, keys = Object.keys(D.TEAMS);
  const order = [...keys].sort((a, b) => (sc[b] || 0) - (sc[a] || 0));
  const max = Math.max(1, ...keys.map(k => sc[k] || 0));
  const lead = order[0];
  if (prevLead && lead !== prevLead) banner(name(lead) + ' ഒന്നാം സ്ഥാനത്ത്!', col(lead));
  prevLead = lead;
  const sig = JSON.stringify([order, sc, D.cheers, D.TEAMS]);
  if (sig === sigBoard) return; sigBoard = sig;
  $('#board').innerHTML = order.map((k, i) => `
    <div class="team ${i === 0 ? 'lead' : ''}" style="--tc:${col(k)}">
      <div class="trow">
        <div style="display:flex;align-items:center;gap:1vw;min-width:0">
          <div class="rank">${i === 0 ? ic('crown') : i + 1}</div>
          <div style="min-width:0">
            <div class="tname ml">${esc(name(k))}</div>
            <div class="tmeta">
              <span>${ic('trophy')} ${esc(D.TEAMS[k].victories)}</span>
              <span>${ic('flame')} ${esc((D.cheers || {})[k] || 0)}</span>
            </div>
          </div>
        </div>
        <div class="tpts">${esc(sc[k] || 0)}</div>
      </div>
      <div class="track"><div class="fill" style="width:${(sc[k] || 0) / max * 100}%"></div></div>
    </div>`).join('');
}

function renderChat(){
  const last = D.chat.slice(-(LITE ? 25 : 40)), newest = last.length ? last[last.length - 1].id : 0;
  const sig = last.map(m => m.id + ':' + total(m.r)).join(',');
  $('#msgCount').textContent = D.chat.length ? D.chat.length + ' സന്ദേശം' : '';
  if (sig === sigMsgs) return; sigMsgs = sig;
  const box = $('#msgs');
  box.innerHTML = last.length ? last.map(m => {
    const fresh = m.id > seenMsg;
    return `<div class="row2 ${fresh ? '' : 'old'}" style="--tc:${col(m.t)}">
      <div class="av">${initial(m.t)}</div>
      <div style="min-width:0">
        <div class="meta2"><b class="ml">${esc(m.u)}</b><small>${esc(name(m.t))}</small>
          ${total(m.r) ? `<span class="rx">${ic('thumb')}${total(m.r)}</span>` : ''}</div>
        <div class="msgtext ml">${esc(m.m)}</div>
      </div></div>`;
  }).join('') : `<div class="empty">${ic('chat')}<div class="ml">ആരും ഇതുവരെ പറഞ്ഞിട്ടില്ല. നീ തുടങ്ങ്!</div></div>`;
  seenMsg = Math.max(seenMsg, newest);
}

function showMeme(){
  const st = $('#stage');
  $('#memeCount').textContent = memeList.length ? memeList.length + ' ട്രോൾ' : '';
  if (!memeList.length) { st.innerHTML = `<div class="empty">${ic('image')}<div class="ml">ട്രോളുകൾ വരാൻ പോകുന്നു</div></div>`; return; }
  const m = memeList[memeNo % memeList.length];
  document.documentElement.style.setProperty('--glow', col(m.t));
  const trending = m.likes > 0 && m.likes === Math.max(...memeList.map(x => x.likes));
  const sig = m.id + ':' + m.likes + ':' + m.laughs + ':' + (trending ? 1 : 0);
  if (sig === sigMeme) return; sigMeme = sig;
  const pic = PHOTO.test(m.img) ? `<img src="${esc(m.img)}" alt="" onerror="imgFail(this)" onload="imgOk(this)">` : `<span class="emo">${esc(m.img)}</span>`;
  st.innerHTML = `
    <div class="meme" style="--tc:${col(m.t)};position:relative">
      ${trending ? `<span class="hot">${ic('flame')} TRENDING</span>` : ''}
      <div class="pic">${pic}</div>
      <div class="foot">
        <div class="cap ml">${esc(m.cap)}</div>
      </div>
      <div class="foot">
        <span class="tag">${ic('pin')} ${esc(name(m.t))}</span>
        <div class="stats"><span>${ic('laugh')} ${esc(m.laughs || 0)}</span><span>${ic('flame')} ${esc(m.likes || 0)}</span></div>
      </div>
    </div>`;
}

function renderTicker(){
  const items = ["MAF 2026 · Majma'a Art Fest 2026",
    ...(D.NOTICES || []).map(n => `${n.title}${n.text ? ' – ' + n.text : ''}`),
    'ചായ തണുക്കും മുമ്പ് വോട്ട് ചെയ്യൂ', 'ട്രോൾ അയക്കൂ, ചുവരിൽ ഒട്ടിക്കാം'];
  const sig = items.join('|');
  if (sig === sigTk) return; sigTk = sig;
  const row = items.map(t => `<span class="ml">${esc(t)}</span>`).join('');
  $('#tk').innerHTML = row + row;
  $('#tk').style.setProperty('--t', Math.max(30, items.join(' ').length * 0.35) + 's');
}

function dbg(msg){ if (!DEBUG) return; const d = $('#dbg'); d.style.display = 'block'; d.textContent = msg; }
function imgOk(el){ dbg('photo OK: ' + el.getAttribute('src') + ' (' + el.naturalWidth + 'x' + el.naturalHeight + ')' + (LITE ? ' · lite' : '')); }
function imgFail(el){
  dbg('photo FAILED: ' + el.getAttribute('src') + (el.dataset.r ? ' (retry failed)' : ' (retrying)') + (LITE ? ' · lite' : ''));
  if (!el.dataset.r) {                        // first failure: try again after 3 s (slow TV network)
    el.dataset.r = '1';
    setTimeout(() => { const base = el.src.split(/[?&]r=/)[0]; el.src = base + (base.indexOf('?') > -1 ? '&' : '?') + 'r=' + Date.now(); }, 3000);
  } else {
    el.style.display = 'none'; el.parentNode.classList.add('nopic');
  }
}
let bannerTimer;
function banner(text, c){
  const b = $('#banner'); b.innerHTML = ic('trophy') + `<span class="ml">${esc(text)}</span>`; b.style.borderColor = c;
  b.classList.add('show'); clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove('show'), 6000);
  burst(c);
}
function burst(c){
  if (LITE) return;
  const box = $('#confetti'), colors = [c, '#d9b26a', '#ffffff', '#8b96a5'];
  for (let i = 0; i < 45; i++) {
    const el = document.createElement('i'); el.className = 'bit';
    el.style.cssText = `left:${Math.random()*100}%;--c:${colors[i % colors.length]};--drift:${(Math.random()*24-12)}vw;--r:${Math.random()*540-270}deg;--d:${2.4+Math.random()*1.6}s;animation-delay:${Math.random()*.3}s`;
    box.appendChild(el); setTimeout(() => el.remove(), 4800);
  }
}

function tickClock(){ $('#clock').textContent = new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12: true}); }

load(); tickClock();
setInterval(load, 30000);
setInterval(() => { memeNo++; showMeme(); }, 9000);
setInterval(tickClock, 15000);
setTimeout(() => location.reload(), 6 * 3600 * 1000);
if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
</script>
